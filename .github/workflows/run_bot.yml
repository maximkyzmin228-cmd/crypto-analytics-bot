name: Crypto Bot Runner

on:
  schedule:
    - cron: '30 7,9,11,13,15 * * *' # Проверки в ключевые часы внутри окна 10:30 - 18:00 МСК
  workflow_dispatch: # Кнопка ручного запуска на GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Для автосохранения памяти и счетчиков постов через git
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install ccxt google-generativeai matplotlib pandas requests

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
